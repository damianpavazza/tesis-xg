[project]
name = "tesis-xg"
version = "0.1.0"
description = "Sistema de analisis de datos futbolisticos - tesis de grado"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "scikit-learn",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
